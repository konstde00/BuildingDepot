name: BuildingDepot
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: pipx install uv
      - name: Install BuildingDepot
        run: python3 deploy/install.py --no-service --no-ask-sudo --dev
      - name: Start services
        run: |
          cd buildingdepot/CentralReplica
          nohup uv run python3 main.py > "$RUNNER_TEMP/bd-replica.log" 2>&1 &
          cd ..
          nohup uv run gunicorn -w 4 -b 127.0.0.1:8081 --access-logfile - CentralService:app > "$RUNNER_TEMP/bd-central.log" 2>&1 &
          nohup uv run gunicorn -w 4 --timeout 120 -b 127.0.0.1:8082 --access-logfile - DataService:app > "$RUNNER_TEMP/bd-data.log" 2>&1 &
          curl -sS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8081/auth/login
          curl -sS -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8082/
      - name: Initialize tests
        run: |
          cd benchmarking-tools/functional-testing-tool
          jq --arg password "$(sed -n 's/^BD_ADMIN_PWD=//p' ../../.env)" '.password = $password' tests/config.json > config.json.tmp
          mv config.json.tmp tests/config.json
          npm install
      - name: Run tests
        run: |
          cd benchmarking-tools/functional-testing-tool
          npm test ./tests/all.js
      - name: Show service logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/bd-*.log
